; PlatformIO Project Configuration File
;
; Default to Arduino Micro for the working PlatformIO port.
; Keep an Uno environment so the original wiring can still be built.

[platformio]
default_envs = micro

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200

[env:uno]
board = uno

[env:micro]
board = micro
lib_deps =
  arduino-libraries/Servo
  arduino-libraries/Keyboard

[env:micro_servo_test]
board = micro
lib_deps =
  arduino-libraries/Servo
build_flags =
  -DSERVO_SWEEP_TEST_MODE=1

[env:micro_keypad_cal]
board = micro
lib_deps =
  arduino-libraries/Servo
build_flags =
  -DKEYPAD_CALIBRATION_MODE=1
