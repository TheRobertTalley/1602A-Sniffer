; PlatformIO Project Configuration File
;
; Default to Arduino Micro for the working PlatformIO port.
; Keep an Uno environment so the original wiring can still be built.

[platformio]
default_envs = micro

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200

[env:uno]
board = uno

[env:micro]
board = micro
